name: GriyaKas v2 Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.v2-payload/**'
      - '.github/workflows/v2-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebuild v2 package
        shell: bash
        run: |
          set -euo pipefail
          cat .v2-payload/part* | base64 --decode > /tmp/GriyaKas-v2.0.0-final.zip
          echo '623b985475143a2aa25fc73a50dec3db0e3ee42895b72ad85ddd131a07e0a775  /tmp/GriyaKas-v2.0.0-final.zip' | sha256sum -c -

      - name: Replace repository with v2 source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          unzip -q /tmp/GriyaKas-v2.0.0-final.zip -d "$tmp"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$tmp"/. .
          rm -rf "$tmp"

      - name: Validate v2 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = '2.0.0'
          test "$(node -p "require('./package.json').version")" = '2.0.0'
          if grep -RniE '(@google/genai|gemini|AI Studio|GEMINI_API_KEY|geminiService)' --exclude-dir=.git .; then
            echo 'AI-related code/configuration is still present.' >&2
            exit 1
          fi

      - name: Commit v2 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Upgrade GriyaKas to v2.0.0'
          git push origin HEAD:main
