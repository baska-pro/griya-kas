name: GriyaKas v2 Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.v2-ready/**'
      - '.github/workflows/v2-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decode and verify v2 package
        shell: bash
        run: |
          set -euo pipefail
          test -s .v2-ready/part00
          base64 --decode .v2-ready/part00 > /tmp/GriyaKas-v2.0.0-ready.tar.xz
          echo '3e389bf90fc5e48592ccb1f3d577a5bdb7bd9bb86c7ad24909e0d6bb21a98efd  /tmp/GriyaKas-v2.0.0-ready.tar.xz' | sha256sum -c -
          tar -tJf /tmp/GriyaKas-v2.0.0-ready.tar.xz >/dev/null

      - name: Replace repository with v2 source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xJf /tmp/GriyaKas-v2.0.0-ready.tar.xz -C "$tmp"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$tmp"/. .
          rm -rf "$tmp"

      - name: Validate v2 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = '2.0.0'
          test "$(node -p "require('./package.json').version")" = '2.0.0'
          test -f RELEASE_NOTES_v2.0.0.md
          test ! -e .v2-ready
          test ! -e .v2-payload
          test ! -e .v2-xz
          test ! -e GriyaKas-v2.0.0-final.zip

      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          rm -rf node_modules dist

      - name: Commit v2 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Upgrade GriyaKas to v2.0.0'
          git push origin HEAD:main
