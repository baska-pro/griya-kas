name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Validate version
        shell: bash
        run: |
          test "$(tr -d '
' < VERSION)" = "$(node -p "require('./package.json').version")"
      - name: Repository hygiene
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(node_modules|dist|\.vite)(/|$)|(^|/)\.env$'; then
            echo 'Generated/private file tracked.' >&2
            exit 1
          fi
