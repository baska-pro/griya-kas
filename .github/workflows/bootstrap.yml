name: Bootstrap GriyaKas v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild reviewed source package
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* > /tmp/griyakas.b64
          base64 --decode /tmp/griyakas.b64 > /tmp/griyakas-source.tar.gz
          tar -xzf /tmp/griyakas-source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/ci.yml

      - name: Commit final v1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows
          git commit -m 'Import and harden GriyaKas v1.0.0'
          git push origin HEAD:main
